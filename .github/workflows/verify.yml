name: Verify and package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests and ad-hoc artifact
    runs-on: macos-15
    # 正常 2~3 分钟。45 分钟曾让一次 runner 级挂起白烧 45 分钟 × 2 个 runner；
    # 15 分钟仍留 5 倍余量，挂起时代价降到十五分之一。
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        # 看门狗只观察不干预：到点给测试进程拍调用栈打进本步骤日志，不杀进程、
        # 永远以 0 退出。用于取证 testEveryKeyIsCovered 在 runner 上的稳定挂起
        # （本地无论脏树还是干净 checkout 都复现不了）。兜底仍是 timeout-minutes。
        run: |
          ./script/ci_hang_watchdog.sh 420 180 &
          ./script/package_release.sh

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreativeWorkshopMac-${{ github.run_number }}-adhoc
          path: |
            dist/CreativeWorkshopMac-*-adhoc.zip
            dist/CreativeWorkshopMac-*-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 14
