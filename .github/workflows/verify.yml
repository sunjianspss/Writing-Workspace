name: Verify and package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests and ad-hoc artifact
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./script/package_release.sh

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreativeWorkshopMac-${{ github.run_number }}-adhoc
          path: |
            dist/CreativeWorkshopMac-*-adhoc.zip
            dist/CreativeWorkshopMac-*-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 14
