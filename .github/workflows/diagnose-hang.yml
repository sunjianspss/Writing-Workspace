name: Diagnose test hang

# 临时诊断 workflow。结论出来后应当删除——它不是长期 CI 的一部分。
#
# 前提已被上一轮实验推翻：原以为是 testEveryKeyIsCovered 这一个测试挂起，
# 但同一 runner、同一 commit、前后脚跑的两次全量，第一次 5s 通过 319 项，
# 第二次卡到被 480s 杀掉。同一个 commit 的 push 与 pull_request 两个 Verify
# 也是一个 2m34s 通过、一个 15m 超时。所以这是 XCTest 层面的竞态，那个测试
# 大概率只是日志停下来的位置。
#
# 本轮只问一个问题：连跑 N 次全量，挂起时日志停在哪？
#   每次都停在同一个测试 → 位置有意义，继续挖那里；
#   停在随机位置       → 通用竞态，该谈重试策略而不是找"那个测试"。

on:
  push:
    branches:
      - fix/pending-cleanup-visibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: 逐个隔离运行
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 预先构建测试（不计入各用例耗时）
        run: swift build --build-tests --disable-sandbox --package-path macos/CreativeWorkshopMac

      - name: 重复全量
        run: |
          # GitHub 用 `bash -e {0}` 跑 step，`set -uo pipefail` 不会关掉 -e。
          # 上一轮就是因此在第一次挂起时直接中止，汇总一行都没打印出来。
          set +e
          set -uo pipefail

          RUNS=8
          LIMIT=150   # 通过只要 5s；150s 足够把挂起认出来，又不至于烧满作业

          pass=0
          hang=0
          fail=0
          summary=""

          for i in $(seq 1 "$RUNS"); do
            echo "::group::第 $i 次全量"
            start=$(date +%s)

            swift test --disable-sandbox --package-path macos/CreativeWorkshopMac \
              > "/tmp/run_$i.log" 2>&1 &
            pid=$!
            ( sleep "$LIMIT"; kill -9 "$pid" 2>/dev/null ) &
            killer=$!

            wait "$pid"
            rc=$?
            kill "$killer" 2>/dev/null

            elapsed=$(( $(date +%s) - start ))
            last=$(grep "Test Case" "/tmp/run_$i.log" | tail -1 | sed 's/.*-\[//; s/\].*//')

            # 必须按耗时区分：秒退的 rc!=0 是「测试真失败」，不是挂起。
            # 混为一谈的话，一次普通的红会被读成一次挂起，整轮统计就废了。
            if [ "$rc" -eq 0 ]; then
              pass=$(( pass + 1 ))
              echo "结果：通过（${elapsed}s）"
              summary="${summary}第 $i 次  通过 ${elapsed}s"$'\n'
            elif [ "$elapsed" -ge "$LIMIT" ]; then
              hang=$(( hang + 1 ))
              echo "结果：★挂起★（${elapsed}s）停在：${last:-未知}"
              tail -20 "/tmp/run_$i.log"
              summary="${summary}第 $i 次  ★挂起★  停在 ${last:-未知}"$'\n'
            else
              fail=$(( fail + 1 ))
              echo "结果：失败 rc=$rc（${elapsed}s）"
              tail -20 "/tmp/run_$i.log"
              summary="${summary}第 $i 次  失败 rc=$rc（${elapsed}s）"$'\n'
            fi

            # 挂起那次会留下孤儿 xctest（上一轮日志末尾就有一条 Terminate
            # orphan process），不清掉可能影响下一次
            pkill -9 -x xctest 2>/dev/null
            echo "::endgroup::"
          done

          echo "=== 汇总：$RUNS 次中 通过 $pass / 挂起 $hang / 失败 $fail ==="
          printf '%s' "$summary"
