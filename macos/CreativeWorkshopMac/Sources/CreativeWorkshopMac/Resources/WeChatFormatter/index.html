            xhs_grid: { background: '#fefefe', text: '#3b3935', accent: '#e65362', surface: '#fff3e8', border: '#e9c9bd', marker: '•' },
            xhs_doodle: { background: '#fffef7', text: '#343434', accent: '#ff2442', surface: '#fff0f3', border: '#ffb6c1', marker: '🎯' }
        };

        function getWechatThemeProfile(themeName = activeWechatCopyMode) {
            return WECHAT_THEME_PROFILES[themeName] || WECHAT_THEME_PROFILES.default;
        }

        // 外链引用收集：公众号会剥掉正文外链的 href（仅 mp.weixin.qq.com 域内链接可保留），
        // 复制时把外链转为「文字+上标[n]」，并在文末生成引用链接列表
        let wechatLinkRefs = [];

        function collectWechatLinkRef(url, text) {
            let idx = wechatLinkRefs.findIndex(ref => ref.url === url);
            if (idx === -1) {
                wechatLinkRefs.push({ url, text });
                idx = wechatLinkRefs.length - 1;
            }
            return idx + 1;
        }

        function buildWechatLinkRefsFooter() {
            if (wechatLinkRefs.length === 0) return '';
            const profile = getWechatThemeProfile();
            let html = `<section style="margin-top:2em;padding-top:1em;border-top:1px solid ${profile.border};font-size:13px;color:${profile.text};text-align:left;">`;
            html += `<p style="margin:0 0 0.5em;font-weight:bold;color:${profile.accent};">引用链接</p>`;
            wechatLinkRefs.forEach((ref, i) => {
                const label = ref.text && ref.text !== ref.url ? `${escapeHtml(ref.text)}: ` : '';
                html += `<p style="margin:0.35em 0;line-height:1.7;word-break:break-all;">[${i + 1}] ${label}${escapeHtml(ref.url)}</p>`;
            });
            html += `</section>`;
            return html;
        }

        function generateWechatHtml(container) {
            // 获取当前主题
            const selectedTheme = currentTheme && themes[currentTheme] ? currentTheme : 'default';
            const isPoetryTheme = selectedTheme.startsWith('poetry');
            activeWechatCopyMode = selectedTheme;
            const profile = getWechatThemeProfile(selectedTheme);
            const baseStyle = getWechatSafeStyle(container, {
                fallbackColor: profile.text,
                fallbackBackground: profile.background,
                includeBackgroundImage: true,
                includeBox: true
            }) + 'box-sizing:border-box;max-width:100%;';
            
            const emittedBg = baseStyle.match(/(?:^|;)\s*background-color:([^;]*)/);
            activeWechatCopyBg = (emittedBg ? emittedBg[1].trim() : '') || profile.background || '#ffffff';

            wechatLinkRefs = [];

            // 统一转义 style 属性，避免 font-family 中的引号截断后续样式。
            let html = `<section style="${escapeHtml(baseStyle)}">`;

            // 遍历所有子元素
            Array.from(container.children).forEach(child => {
                html += processElement(child, isPoetryTheme);
            });

            // 文末追加外链引用列表
            html += buildWechatLinkRefsFooter();

            html += '</section>';
            return html;
        }

        const WECHAT_SAFE_INLINE_PROPS = [
            'font-family', 'font-size', 'font-weight', 'font-style', 'line-height', 'letter-spacing',
            'text-align', 'text-indent', 'text-decoration', 'vertical-align', 'color',
            'margin', 'padding', 'border-top', 'border-right', 'border-bottom', 'border-left',
            'border-radius', 'word-break', 'overflow-wrap', 'white-space'
        ];

        function isTransparentWechatValue(value) {
            return !value || value === 'transparent' || value === 'rgba(0, 0, 0, 0)';
        }

        // 公众号编辑器可能丢掉 alpha，把 rgba(…) 当成实心色渲染：万圣节 15% 的橙
        // 会变成纯橙，tech 的半透明边框会变成实线亮边。复制前一律按当前主题的纸底
        // 把半透明压平成实色——视觉几乎不变，且不再依赖编辑器支持 alpha。
        //
        // 必须整串替换而不是只处理纯色字段：实测 tech 主题 22 处 rgba 里，
        // background-color 只占 4 处，其余 16 处藏在 border-top/right/bottom/left
        // 的简写值里，还有 1 处在 background-image 的渐变色标里。
        function hexToRgbTriplet(hex) {
            const m = /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(String(hex || '').trim());
            if (!m) return null;
            let h = m[1];
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const n = parseInt(h, 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        function flattenWechatAlpha(value, backdrop) {
            const text = String(value == null ? '' : value);
            if (text.indexOf('rgba(') === -1) return value;
            const base = hexToRgbTriplet(backdrop) || [255, 255, 255];
            return text.replace(
                /rgba\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)/gi,
                (whole, r, g, b, a) => {
                    const alpha = Math.max(0, Math.min(1, parseFloat(a)));
                    if (!isFinite(alpha)) return whole;
                    const mixed = [r, g, b].map((channel, i) => {
                        const v = Math.round(parseFloat(channel) * alpha + base[i] * (1 - alpha));
                        return Math.max(0, Math.min(255, v));
                    });
                    return '#' + mixed.map(v => v.toString(16).padStart(2, '0')).join('');
                }
            );
        }

        function normalizeWechatStyleValue(prop, value) {
            value = String(value || '').trim();
            if (!value || value === 'none' || value === 'normal' || value === 'auto') return '';
            if (prop === 'text-align') value = { start: 'left', end: 'right' }[value] || value;
            if (prop === 'font-family') value = value.replace(/"/g, "'");
            if (prop.includes('color') && value.startsWith('rgb')) value = rgbToHex(value);
            if (prop.startsWith('border-') && (/^0px\s/.test(value) || /\snone\s/.test(` ${value} `))) return '';
            if (prop === 'background-image') {
                if (/url\s*\(/i.test(value)) return '';
                if (!/(?:repeating-)?linear-gradient\s*\(/i.test(value)) return '';
            }
            // 放在最后：此时 value 已完成各属性自己的归一化，只剩把 alpha 压平。
            return flattenWechatAlpha(value, getWechatThemeProfile().background);
        }

        function hasWechatSurface(el) {
            const computed = window.getComputedStyle(el);
            if (!isTransparentWechatValue(computed.backgroundColor)) return true;
            const backgroundImage = computed.backgroundImage || '';
            const textClip = computed.getPropertyValue('background-clip') === 'text'
                || computed.getPropertyValue('-webkit-background-clip') === 'text';
            return !textClip && /(?:repeating-)?linear-gradient\s*\(/i.test(backgroundImage);
        }

        function copyContrastRatio(a, b) {
            const rgb = hexToRgbTriplet(a), other = hexToRgbTriplet(b);
            if (!rgb || !other) return 21;
            const lum = (c) => {
                const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
                return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
            };
            const l1 = Math.max(lum(rgb), lum(other)), l2 = Math.min(lum(rgb), lum(other));
            return (l1 + 0.05) / (l2 + 0.05);
        }

        // 只在「几乎不可读」时介入，并且只压到刚好可读，避免把设计好的配色改味。
        // 这条兜底是有来历的：halloween 此前粘出去正文对比度只有 1.02:1（浅米底
        // 配浅色字，等于隐形），gradient 的白标题落在浅色兜底底上是 1.06:1。
        function ensureCopyContrast(hex, background) {
            if (!hex || copyContrastRatio(hex, background) >= 2) return hex;
            let rgb = hexToRgbTriplet(hex);
            if (!rgb) return hex;
            const darken = copyContrastRatio('#000000', background) > copyContrastRatio('#ffffff', background);
            for (let i = 0; i < 12; i++) {
                rgb = rgb.map(v => Math.max(0, Math.min(255, Math.round(darken ? v * 0.82 : v + (255 - v) * 0.18))));
                const current = '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
                if (copyContrastRatio(current, background) >= 3) return current;
            }
            return darken ? '#333333' : '#f5f5f5';
        }

        // 纯渐变背景的 backgroundColor 是透明的。此时兜底色应当从渐变自己的第一个
        // 色标推导，而不是取色板里手写的值——手写值会和主题 CSS 漂移：gradient 主题
        // 的标题是纯白，色板却写了浅色 #fbf7ff，渐变一旦被公众号过滤就是白字白底。
        function deriveGradientFallback(backgroundImage) {
            if (!backgroundImage || !/(?:repeating-)?linear-gradient\s*\(/i.test(backgroundImage)) return '';
            const stop = backgroundImage.match(/rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}/);
            if (!stop) return '';
            const hex = rgbToHex(stop[0]);
            return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '';
        }

        function getWechatSafeStyle(el, options = {}) {
            const computed = window.getComputedStyle(el);
            const props = options.props || WECHAT_SAFE_INLINE_PROPS;
            let style = '';

            props.forEach(prop => {
                const value = normalizeWechatStyleValue(prop, computed.getPropertyValue(prop));
                if (value) style += `${prop}:${value};`;
            });

            let foreground = normalizeWechatStyleValue('color', computed.color);
            if (!foreground || foreground === 'transparent') foreground = options.fallbackColor || '';

            let background = normalizeWechatStyleValue('background-color', computed.backgroundColor);
            if (!background || background === 'transparent') {
                background = deriveGradientFallback(computed.backgroundImage) || options.fallbackBackground || '';
            }
            if (background) style += `background-color:${background};`;

            if (options.includeBackgroundImage) {
                const textClip = computed.getPropertyValue('background-clip') === 'text'
                    || computed.getPropertyValue('-webkit-background-clip') === 'text';
                const backgroundImage = textClip ? '' : normalizeWechatStyleValue('background-image', computed.backgroundImage);
                if (backgroundImage) style += `background-image:${backgroundImage};`;
            }

            if (foreground) {
                const backdrop = background || options.fallbackBackground || activeWechatCopyBg;
                foreground = ensureCopyContrast(foreground, backdrop);
                style = style.replace(/(^|;)color:[^;]*;/, '$1') + `color:${foreground};`;
            }

            if (options.includeSizing) {
                ['width', 'max-width', 'height'].forEach(prop => {
                    const value = normalizeWechatStyleValue(prop, computed.getPropertyValue(prop));
                    if (value) style += `${prop}:${value};`;
                });
            }
            if (options.includeBox) style += 'box-sizing:border-box;';
            return style;
        }

        function decodeWechatPseudoContent(rawContent) {
            const raw = String(rawContent || '').trim();
            if (!raw || raw === 'none' || raw === 'normal' || raw === '""' || raw === "''") return '';
            const quote = raw[0];
            let text = (quote === '"' || quote === "'") && raw[raw.length - 1] === quote
                ? raw.slice(1, -1)
                : raw;
            return text.replace(/\\A\s?/gi, '\n').replace(/\\([\\"'])/g, '$1').trimEnd();
        }

        function getWechatPseudo(el, pseudo) {
            const computed = window.getComputedStyle(el, pseudo);
            const text = decodeWechatPseudoContent(computed.content);
            if (!text) return null;
            const color = normalizeWechatStyleValue('color', computed.color);
            const size = normalizeWechatStyleValue('font-size', computed.fontSize);
            const weight = normalizeWechatStyleValue('font-weight', computed.fontWeight);
            const spacing = normalizeWechatStyleValue('letter-spacing', computed.letterSpacing);
            const style = `${color ? `color:${color};` : ''}${size ? `font-size:${size};` : ''}${weight ? `font-weight:${weight};` : ''}${spacing ? `letter-spacing:${spacing};` : ''}`;
            return { text, style };
        }

        function renderWechatPseudo(pseudo) {
            if (!pseudo) return '';
            return `<span style="${escapeHtml(pseudo.style)}">${escapeHtml(pseudo.text)}</span>`;
        }

        function decorateWechatContent(el, content) {
            return `${renderWechatPseudo(getWechatPseudo(el, '::before'))}${content}${renderWechatPseudo(getWechatPseudo(el, '::after'))}`;
        }

        function renderBrocadeTitle(el, content) {
            const computed = window.getComputedStyle(el);
            const borderColor = rgbToHex(computed.borderTopColor) || '#b7a68c';
            const background = rgbToHex(computed.backgroundColor) || '#fbf7ef';
            const color = rgbToHex(computed.color) || '#59372e';
            // 字号/内边距/字距一律取主题 CSS 的实际渲染值，不写死。
            // 上游把它们钉在 24px / 10px 15px，而创作工坊的织锦是 20px / 22px 16px，
            // 写死会把已在真实公众号验证过的那版悄悄改掉。
            const fontFamily = (computed.fontFamily || "'Songti SC','STSong','SimSun',serif").replace(/"/g, "'");
            const innerPadding = computed.padding && computed.padding !== '0px' ? computed.padding : '22px 16px';
            const outerStyle = `margin:${computed.margin};padding:4px;border:1px solid ${borderColor};background-color:${background};box-sizing:border-box;`;
            const innerStyle = `padding:${innerPadding};border:1px solid ${borderColor};font-family:${fontFamily};font-size:${computed.fontSize};line-height:${computed.lineHeight};font-weight:${computed.fontWeight};letter-spacing:${computed.letterSpacing};text-align:${computed.textAlign};color:${color};`;
            return `<section style="${escapeHtml(outerStyle)}"><section style="${escapeHtml(innerStyle)}">${content}</section></section>`;
        }

        // 处理单个元素，生成只依赖内联样式、且可在公众号过滤后安全降级的 HTML。
        function processElement(el, isPoetryTheme = false, copyMode = activeWechatCopyMode) {
            const tag = el.tagName.toLowerCase();
            const profile = getWechatThemeProfile(copyMode);
            let style = '';
            let content = '';

            switch (tag) {
                case 'h1':
                case 'h2':
                case 'h3':
                case 'h4':
                case 'h5':
                case 'h6': {
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.accent,
                        fallbackBackground: hasWechatSurface(el) ? profile.surface : '',
                        includeBackgroundImage: true,
                        includeBox: true
                    });
                    content = decorateWechatContent(el, processChildren(el, isPoetryTheme));
                    if (copyMode === 'brocade' && tag === 'h1') return renderBrocadeTitle(el, content);
                    break;
                }

                case 'p':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: hasWechatSurface(el) ? profile.surface : '',
                        includeBackgroundImage: true
                    });
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'blockquote':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: profile.surface,
                        includeBackgroundImage: true,
                        includeBox: true
                    });
                    if (copyMode === 'brocade') {
                        style = style.replace(/font-family:[^;]+;/, "font-family:'STKaiti','KaiTi',serif;");
                    }
                    content = decorateWechatContent(el, processChildren(el, isPoetryTheme));
                    break;

                case 'pre':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: profile.surface,
                        includeBackgroundImage: true,
                        includeBox: true
                    }) + 'overflow-x:auto;';
                    content = serializeCodeForWechat(el).replace(/(<br>)+$/, '');
                    break;

                case 'code':
                    if (el.parentElement && el.parentElement.tagName.toLowerCase() === 'pre') return escapeHtml(el.textContent);
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.accent,
                        fallbackBackground: profile.surface,
                        includeBox: true
                    });
                    content = escapeHtml(el.textContent);
                    break;

                case 'strong':
                case 'b':
                case 'em':
                case 'i':
                case 'mark':
                case 'del':
                case 's':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.accent,
                        fallbackBackground: (tag === 'mark' || hasWechatSurface(el)) ? profile.surface : '',
                        includeBackgroundImage: true
                    });
                    content = decorateWechatContent(el, processChildren(el, isPoetryTheme));
                    break;

                case 'a': {
                    style = getWechatSafeStyle(el, { fallbackColor: profile.accent });
                    content = processChildren(el, isPoetryTheme);
                    const href = (el.getAttribute('href') || '').trim();
                    if (!href || href.startsWith('#') || /^https?:\/\/mp\.weixin\.qq\.com\//i.test(href)) {
                        return `<a href="${escapeHtml(href || '#')}" style="${escapeHtml(style)}">${content}</a>`;
                    }
                    const refNo = collectWechatLinkRef(href, el.textContent.trim());
                    return `<span style="color:${profile.accent};">${content}</span><sup style="font-size:0.75em;color:${profile.accent};">[${refNo}]</sup>`;
                }

                case 'ul':
                case 'ol':
                    return renderListForWechat(el, tag === 'ol', isPoetryTheme);

                case 'li':
                    style = getWechatSafeStyle(el, { fallbackColor: profile.text });
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'table':
                    style = getWechatSafeStyle(el, { fallbackColor: profile.text, includeBox: true }) + 'width:100%;border-collapse:collapse;';
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'thead':
                case 'tbody':
                case 'tr':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: hasWechatSurface(el) ? profile.surface : '',
                        includeBackgroundImage: true
                    });
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'th':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.accent,
                        fallbackBackground: profile.surface,
                        includeBackgroundImage: true,
                        includeBox: true
                    });
                    if (!/border-(?:top|right|bottom|left):/.test(style)) style += `border:1px solid ${profile.border};`;
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'td':
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: hasWechatSurface(el) ? profile.background : '',
                        includeBackgroundImage: true,
                        includeBox: true
                    });
                    if (!/border-(?:top|right|bottom|left):/.test(style)) style += `border:1px solid ${profile.border};`;
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'hr': {
                    const pseudo = getWechatPseudo(el, '::before') || getWechatPseudo(el, '::after');
                    const marker = pseudo || (profile.separator ? { text: profile.separator, style: `color:${profile.accent};` } : null);
                    if (marker) {
                        const markerStyle = `margin:2em 0;text-align:center;line-height:1.8;${marker.style}`;
                        return `<p style="${escapeHtml(markerStyle)}">${escapeHtml(marker.text)}</p>`;
                    }
                    style = getWechatSafeStyle(el, { fallbackColor: profile.border, includeBackgroundImage: true });
                    if (!style.includes('border-top:') && !style.includes('background-color:')) style += `border-top:1px solid ${profile.border};`;
                    return `<hr style="${escapeHtml(style)}">`;
                }

                case 'img': {
                    const src = escapeHtml(el.getAttribute('src') || '');
                    const alt = escapeHtml(el.getAttribute('alt') || '');
                    if (el.dataset && el.dataset.formula) {
                        return `<img src="${src}" alt="${alt}" style="${escapeHtml(el.getAttribute('style') || '')}">`;
                    }
                    let imgStyle = getWechatSafeStyle(el, { includeSizing: true, includeBox: true });
                    const rawInline = (el.getAttribute('style') || '').trim();
                    if (rawInline && /(?:width|max-width)\s*:/.test(rawInline)) imgStyle += rawInline;
                    if (!imgStyle.includes('max-width:')) imgStyle += 'max-width:100%;';
                    imgStyle += 'height:auto;display:block;';
                    return `<img src="${src}" alt="${alt}" style="${escapeHtml(imgStyle)}">`;
                }

                case 'br':
                    return '<br>';

                case 'sup':
                case 'sub':
                    style = getWechatSafeStyle(el, { fallbackColor: profile.accent });
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'div':
                case 'section':
                    if (el.classList.contains('callout')) {
                        style = getWechatSafeStyle(el, {
                            fallbackColor: profile.text,
                            fallbackBackground: profile.surface,
                            includeBackgroundImage: true,
                            includeBox: true
                        });
                        content = processChildren(el, isPoetryTheme);
                        break;
                    }
                    if (el.classList.contains('callout-title')) {
                        style = getWechatSafeStyle(el, { fallbackColor: profile.accent }) + 'font-weight:bold;';
                        content = processChildren(el, isPoetryTheme);
                        break;
                    }
                    if (el.className && (el.className.includes('katex-display') || el.className.includes('katex'))) {
                        const latex = extractLatexFromKatex(el);
                        const unicodeFormula = latexToUnicode(latex);
                        return `<p style="margin:1em 0;text-align:center;font-size:16px;line-height:2;color:${profile.text};">${escapeHtml(unicodeFormula)}</p>`;
                    }
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: hasWechatSurface(el) ? profile.surface : '',
                        includeBackgroundImage: true,
                        includeBox: true
                    });
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'span':
                    if (el.className && el.className.includes('katex')) {
                        const latex = extractLatexFromKatex(el);
                        const unicodeFormula = latexToUnicode(latex);
                        return `<span style="font-style:italic;color:${profile.text};">${escapeHtml(unicodeFormula)}</span>`;
                    }
                    style = getWechatSafeStyle(el, {
                        fallbackColor: profile.text,
                        fallbackBackground: hasWechatSurface(el) ? profile.surface : '',
                        includeBackgroundImage: true
                    });
                    content = processChildren(el, isPoetryTheme);
                    break;

                case 'input':
                    if (el.type === 'checkbox') return el.checked ? '☑ ' : '☐ ';
                    return '';

                default:
                    return processChildren(el, isPoetryTheme);
            }

            if (!content) return '';
            return `<${tag} style="${escapeHtml(style)}">${content}</${tag}>`;
        }

        // 代码块序列化：保留语法高亮 span 的内联颜色；
        // 公众号编辑器对 pre 内换行/空格的保留不可靠，逐行转 <br> + &nbsp;（不折行，保护字符画）
        function serializeCodeForWechat(el) {
            let out = '';
            el.childNodes.forEach(node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    out += escapeHtml(node.textContent)
                        .replace(/\t/g, '    ')
                        .replace(/ /g, '&nbsp;')
                        .replace(/\n/g, '<br>');
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.tagName.toLowerCase() === 'br') {
                        out += '<br>';
                        return;
                    }
                    const inner = serializeCodeForWechat(node);
                    const color = node.style && node.style.color ? rgbToHex(node.style.color) : '';
                    out += color && color !== 'transparent' ? `<span style="color:${color};">${inner}</span>` : inner;
                }
            });
            return out;
        }

        // 列表转公众号安全结构：section + 每项一个 p（手动项目符号 + 悬挂缩进）
        function renderListForWechat(listEl, ordered, isPoetryTheme) {
            const profile = getWechatThemeProfile();
            let idx = 0;
            let itemsHtml = '';

            Array.from(listEl.children).forEach(li => {
                if (li.tagName.toLowerCase() !== 'li') return;
                idx++;

                let inlineHtml = '';
                let blockHtml = '';
                li.childNodes.forEach(child => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        inlineHtml += escapeHtml(child.textContent);
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        const t = child.tagName.toLowerCase();
                        if (t === 'ul' || t === 'ol') {
                            blockHtml += renderListForWechat(child, t === 'ol', isPoetryTheme);
                        } else if (t === 'pre' || t === 'blockquote' || t === 'table' || t === 'div') {
                            blockHtml += processElement(child, isPoetryTheme);
                        } else if (t === 'p') {
                            // 松散列表：去掉 p 包装避免 p 套 p，多段之间用 <br> 分隔
                            if (inlineHtml.trim()) inlineHtml += '<br>';
                            inlineHtml += processChildren(child, isPoetryTheme);
                        } else {
                            inlineHtml += processElement(child, isPoetryTheme);
                        }
                    }
                });

                const computed = window.getComputedStyle(li);
                const pseudo = getWechatPseudo(li, '::before');
                const markerComputed = window.getComputedStyle(li, '::marker');
                const markerColor = pseudo?.style.match(/color:([^;]+);/)?.[1]
                    || normalizeWechatStyleValue('color', markerComputed.color)
                    || profile.accent;
                const hasCheckbox = !!li.querySelector(':scope > input[type="checkbox"]');
                const markerText = hasCheckbox ? '' : (ordered ? `${idx}.` : (pseudo?.text || profile.marker || '•'));
                const markerHtml = markerText
                    ? `<span style="color:${markerColor};">${escapeHtml(markerText)}&nbsp;&nbsp;</span>`
                    : '';
                const align = { start: 'left', end: 'right' }[computed.textAlign] || computed.textAlign || 'left';
                const centered = align === 'center';
                const itemStyle = `margin:${computed.margin};line-height:${computed.lineHeight};text-align:${align};color:${rgbToHex(computed.color) || profile.text};${centered ? '' : 'padding-left:1.5em;text-indent:-1.5em;'}`;
                itemsHtml += `<p style="${escapeHtml(itemStyle)}">${markerHtml}${inlineHtml}</p>`;
                if (blockHtml) {
                    itemsHtml += `<section style="margin:0 0 0 1.5em;">${blockHtml}</section>`;
                }
            });

            const wrapStyle = getWechatSafeStyle(listEl, { fallbackColor: profile.text });
            return `<section style="${escapeHtml(wrapStyle)}">${itemsHtml}</section>`;
        }

        // 处理子元素
        function processChildren(el, isPoetryTheme = false) {
            const parentTag = el.tagName ? el.tagName.toLowerCase() : '';
            // 这些容器的直接文本子节点只能是格式化空白（li/tr 之间的换行），
            // 原样输出会成为无效位置的裸文本，公众号编辑器可能把它转成换行
            const dropWhitespaceText = ['ul', 'ol', 'table', 'thead', 'tbody', 'tr'].includes(parentTag);
            let result = '';
            el.childNodes.forEach(child => {
                if (child.nodeType === Node.TEXT_NODE) {
                    if (dropWhitespaceText && !child.textContent.trim()) return;
                    // 必须转义，否则正文里的 < > & 会破坏生成的 HTML 结构
                    result += escapeHtml(child.textContent);
                } else if (child.nodeType === Node.ELEMENT_NODE) {
                    result += processElement(child, isPoetryTheme);
                }
            });
            return result;
        }

        // 从 KaTeX 元素中提取原始 LaTeX
        function extractLatexFromKatex(el) {
            // KaTeX 会在 annotation 元素中保存原始 LaTeX
            const annotation = el.querySelector('annotation[encoding="application/x-tex"]');
            if (annotation) {
                return annotation.textContent || '';
            }
            // 备用方案：尝试从 aria-label 获取
            const mathEl = el.querySelector('.katex-mathml math');
            if (mathEl && mathEl.getAttribute('aria-label')) {
                return mathEl.getAttribute('aria-label');
            }
            // 最后尝试获取纯文本
            const html = el.querySelector('.katex-html');
            if (html) {
                return html.textContent || '';
            }
            return el.textContent || '';
        }

        // LaTeX 转 Unicode（常用符号）
        function latexToUnicode(latex) {
            if (!latex) return '';
            
            let result = latex;
            
            // 数学运算符和关系符号
            const replacements = [
                // 希腊字母
                [/\\alpha/g, 'α'], [/\\beta/g, 'β'], [/\\gamma/g, 'γ'], [/\\delta/g, 'δ'],
                [/\\epsilon/g, 'ε'], [/\\zeta/g, 'ζ'], [/\\eta/g, 'η'], [/\\theta/g, 'θ'],
                [/\\iota/g, 'ι'], [/\\kappa/g, 'κ'], [/\\lambda/g, 'λ'], [/\\mu/g, 'μ'],
                [/\\nu/g, 'ν'], [/\\xi/g, 'ξ'], [/\\pi/g, 'π'], [/\\rho/g, 'ρ'],
                [/\\sigma/g, 'σ'], [/\\tau/g, 'τ'], [/\\upsilon/g, 'υ'], [/\\phi/g, 'φ'],
                [/\\chi/g, 'χ'], [/\\psi/g, 'ψ'], [/\\omega/g, 'ω'],
                [/\\Gamma/g, 'Γ'], [/\\Delta/g, 'Δ'], [/\\Theta/g, 'Θ'], [/\\Lambda/g, 'Λ'],
                [/\\Xi/g, 'Ξ'], [/\\Pi/g, 'Π'], [/\\Sigma/g, 'Σ'], [/\\Phi/g, 'Φ'],
                [/\\Psi/g, 'Ψ'], [/\\Omega/g, 'Ω'],
                
                // 关系运算符
                [/\\leq/g, '≤'], [/\\le/g, '≤'], [/\\geq/g, '≥'], [/\\ge/g, '≥'],
                [/\\neq/g, '≠'], [/\\ne/g, '≠'], [/\\approx/g, '≈'], [/\\equiv/g, '≡'],
                [/\\sim/g, '∼'], [/\\simeq/g, '≃'], [/\\cong/g, '≅'],
                [/\\ll/g, '≪'], [/\\gg/g, '≫'],
                [/\\subset/g, '⊂'], [/\\supset/g, '⊃'], [/\\subseteq/g, '⊆'], [/\\supseteq/g, '⊇'],
                [/\\in/g, '∈'], [/\\notin/g, '∉'], [/\\ni/g, '∋'],
                
                // 箭头
                [/\\rightarrow/g, '→'], [/\\to/g, '→'], [/\\leftarrow/g, '←'],
                [/\\Rightarrow/g, '⇒'], [/\\Leftarrow/g, '⇐'], [/\\Leftrightarrow/g, '⇔'],
                [/\\leftrightarrow/g, '↔'], [/\\uparrow/g, '↑'], [/\\downarrow/g, '↓'],
                [/\\mapsto/g, '↦'],
                
                // 运算符
                [/\\times/g, '×'], [/\\div/g, '÷'], [/\\cdot/g, '·'], [/\\ast/g, '∗'],
                [/\\pm/g, '±'], [/\\mp/g, '∓'], [/\\oplus/g, '⊕'], [/\\otimes/g, '⊗'],
                [/\\cup/g, '∪'], [/\\cap/g, '∩'], [/\\vee/g, '∨'], [/\\wedge/g, '∧'],
                
                // 特殊符号
                [/\\infty/g, '∞'], [/\\partial/g, '∂'], [/\\nabla/g, '∇'],
                [/\\forall/g, '∀'], [/\\exists/g, '∃'], [/\\nexists/g, '∄'],
                [/\\emptyset/g, '∅'], [/\\varnothing/g, '∅'],
                [/\\angle/g, '∠'], [/\\triangle/g, '△'], [/\\square/g, '□'],
                [/\\circ/g, '°'], [/\\bullet/g, '•'], [/\\star/g, '★'],
                [/\\prime/g, '′'], [/\\dagger/g, '†'], [/\\ddagger/g, '‡'],
                [/\\ldots/g, '…'], [/\\cdots/g, '⋯'], [/\\vdots/g, '⋮'], [/\\ddots/g, '⋱'],
                
                // 积分、求和等
                [/\\int/g, '∫'], [/\\iint/g, '∬'], [/\\iiint/g, '∭'], [/\\oint/g, '∮'],
                [/\\sum/g, '∑'], [/\\prod/g, '∏'], [/\\coprod/g, '∐'],
                
                // 根号和分数
                [/\\sqrt\{([^}]*)\}/g, '√($1)'],
                [/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)'],
                
                // 上下标 - 简化处理
                [/\^(\{[^}]+\}|\w)/g, (m, p) => {
                    const content = p.startsWith('{') ? p.slice(1, -1) : p;
                    // 常用上标
                    const superscripts = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹',
                        '+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ'};
                    return content.split('').map(c => superscripts[c] || '^' + c).join('');
                }],
                [/_(\{[^}]+\}|\w)/g, (m, p) => {
                    const content = p.startsWith('{') ? p.slice(1, -1) : p;
                    // 常用下标
                    const subscripts = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉',
                        '+':'₊','-':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','i':'ᵢ','n':'ₙ','o':'ₒ','x':'ₓ'};
                    return content.split('').map(c => subscripts[c] || '_' + c).join('');
                }],
                
                // 绝对值和括号
                [/\\left\|/g, '|'], [/\\right\|/g, '|'],
                [/\\left\(/g, '('], [/\\right\)/g, ')'],
                [/\\left\[/g, '['], [/\\right\]/g, ']'],
                [/\\left\{/g, '{'], [/\\right\}/g, '}'],
                [/\\lvert/g, '|'], [/\\rvert/g, '|'],
                [/\\langle/g, '⟨'], [/\\rangle/g, '⟩'],
                [/\\lfloor/g, '⌊'], [/\\rfloor/g, '⌋'],
                [/\\lceil/g, '⌈'], [/\\rceil/g, '⌉'],
                
                // 大括号 cases 环境（分段函数）
                [/\\begin\{cases\}([\s\S]*?)\\end\{cases\}/g, (m, content) => {
                    const lines = content.split('\\\\').map(line => {
                        return line.replace(/&/g, '  ').trim();
                    }).filter(l => l);
                    return '{ ' + lines.join(' ; ') + ' }';
                }],
                
                // boxed
                [/\\boxed\{([^}]*)\}/g, '【$1】'],
                
                // 文本命令
                [/\\text\{([^}]*)\}/g, '$1'],
                [/\\textbf\{([^}]*)\}/g, '$1'],
                [/\\mathrm\{([^}]*)\}/g, '$1'],
                [/\\mathbf\{([^}]*)\}/g, '$1'],
                [/\\mathit\{([^}]*)\}/g, '$1'],
                
                // 空格
                [/\\quad/g, '  '], [/\\qquad/g, '    '],
                [/\\,/g, ' '], [/\\;/g, ' '], [/\\:/g, ' '],
                [/\\ /g, ' '],
                
                // 清理多余的花括号
                [/\{([^{}]+)\}/g, '$1'],
            ];
            
            // 应用所有替换规则
            for (const [pattern, replacement] of replacements) {
                result = result.replace(pattern, replacement);
            }
            
            // 清理多余空格
            result = result.replace(/\s+/g, ' ').trim();
            
            // 再次清理残留的 LaTeX 命令（以 \ 开头的未知命令）
            result = result.replace(/\\[a-zA-Z]+/g, '');
            
            return result;
        }

        // RGB 转 Hex（半透明颜色保留 alpha，避免复制后变成不透明纯色块）
        function rgbToHex(rgb) {
            if (!rgb) return '#333333';
            if (rgb.startsWith('#')) return rgb;
            if (rgb === 'transparent' || rgb === 'rgba(0, 0, 0, 0)') return 'transparent';

            const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!match) return rgb;

            const r = parseInt(match[1]);
            const g = parseInt(match[2]);
            const b = parseInt(match[3]);
            const a = match[4] === undefined ? 1 : parseFloat(match[4]);

            if (a === 0) return 'transparent';
            // 半透明按当前主题纸底压平成实色，不再原样吐 rgba()。
            // rgbToHex 的调用点全部在公众号复制路径上（含 renderBrocadeTitle、
            // 列表项与行内色），公众号丢掉 alpha 时那些颜色会跳成实心。
            if (a < 1) {
                return flattenWechatAlpha(`rgba(${r}, ${g}, ${b}, ${a})`, getWechatThemeProfile().background);
            }

            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        // ==================== 工具函数 ====================
        function debounce(fn, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), wait);
            };
        }

        }
