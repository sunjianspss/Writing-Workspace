<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian → 微信公众号排版工具 Pro</title>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <script src="vendor/html2pdf.bundle.min.js"></script>
    <script src="vendor/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-hover: #252532;
            --text-primary: #e8e8ed;
            --text-secondary: #8888a0;
            --text-muted: #5c5c70;
            --accent: #8aa0b6;
            --accent-hover: #a8b8c8;
            --accent-soft: rgba(138, 160, 182, 0.14);
            --accent-glow: rgba(138, 160, 182, 0.18);
            --success: #7aa28b;
            --warning: #b39b6a;
            --error: #b77b7b;
            --border: #2a2a3a;
            --border-hover: #3a3a50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 */
        .header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex: 0 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-hover);
            border: 1px solid var(--border-hover);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .logo h1 {
            font-size: 1.125rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            font-size: 0.7rem;
            background: var(--bg-hover);
            border: 1px solid var(--border-hover);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 0.5rem;
            font-weight: 500;
        }

        /* 统计信息 */
        .stats {
            display: flex;
            gap: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* 按钮组 */
        .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .btn:focus-visible,
        .theme-card:focus-visible,
        .toc-item:focus-visible,
        .modal-close:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--accent-hover);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
        }

        .btn-icon {
            padding: 0.5rem;
            min-width: 36px;
            justify-content: center;
        }

        /* 导出下拉菜单 */
        .export-dropdown {
            position: relative;
            display: inline-block;
        }

        .export-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            min-width: 150px;
            z-index: 1000;
            overflow: hidden;
        }

        .export-menu.show {
            display: block;
        }

        .export-item {
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .export-item:hover {
            background: var(--bg-hover);
        }

        .export-item:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }

        /* 主容器 */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1 1 auto;
            min-height: 0;
        }

        .main-container.fullscreen-mode {
            grid-template-columns: 1fr;
        }

        .main-container.fullscreen-mode .panel:first-child {
            display: none;
        }

        .panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            position: relative;
            min-height: 0; /* 关键：让 flex 子元素可以收缩 */
            overflow: hidden;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: var(--bg-secondary);
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
            flex-shrink: 0; /* 防止头部被压缩 */
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .draft-status {
            margin-left: 0.65rem;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }

        .draft-status.error { color: var(--error); }
        .draft-status.saved { color: var(--success); }

        .panel-actions {
            display: flex;
            gap: 0.4rem;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            scroll-behavior: smooth;
            min-height: 0; /* 关键：让内容区可以滚动 */
        }

        /* 预览滚动容器 - 独立滚动 */
        #preview-scroll {
            height: 100%;
            overflow-y: scroll !important;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; /* iOS 滚动优化 */
            overscroll-behavior: contain; /* 防止滚动穿透 */
            scrollbar-gutter: stable; /* 始终显示滚动条占位 */
        }

        /* 确保预览面板可以接收滚动事件 */
        .panel:last-child .panel-content {
            pointer-events: auto;
        }

        /* 强制显示滚动条 (Windows/Mac) */
        #preview-scroll {
            scrollbar-width: auto; /* Firefox */
        }

        /* Markdown 输入区 */
        #markdown-input {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.875rem;
            line-height: 1.7;
            padding: 1.25rem;
            resize: none;
            outline: none;
            tab-size: 2;
        }

        #markdown-input::placeholder {
            color: var(--text-muted);
        }

        /* 拖拽上传区域 */
        .drop-zone {
            position: absolute;
            inset: 0;
            background: var(--accent-soft);
            border: 2px dashed var(--accent);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .drop-zone.active {
            display: flex;
        }

        .drop-zone-text {
            background: var(--bg-tertiary);
            padding: 1.5rem 2.5rem;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--accent);
        }

        /* 预览区域 */
        #preview-container {
            padding: 2rem;
            background: #fff;
            min-height: auto;
        }

        /* 代码块（字符画/关系图）显示优化：使用等宽字体并禁用自动换行 */
        #preview-container pre,
        #preview-container pre code {
            font-family: "Sarasa Mono SC","Noto Sans Mono CJK SC","JetBrains Mono","Fira Code",Consolas,monospace !important;
            white-space: pre !important;
        }

        #preview-container pre {
            overflow-x: auto !important;
            tab-size: 4;
        }

        #preview-container pre code {
            display: block;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            color: inherit !important;
            line-height: inherit;
        }

        /* 目录面板 */
        .toc-panel {
            position: absolute;
            top: 50px;
            right: 10px;
            width: 220px;
            max-height: 60%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .toc-panel.show {
            display: block;
        }

        .toc-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .toc-content {
            padding: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .toc-item {
            display: block;
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
            border: 0;
            background: transparent;
            text-align: left;
        }

        .toc-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .toc-item.level-2 { padding-left: 1.5rem; }
        .toc-item.level-3 { padding-left: 2.25rem; font-size: 0.7rem; }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-close {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 1.25rem 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
        }

        /* 主题网格 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .theme-card {
            padding: 0.875rem;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: var(--bg-tertiary);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .theme-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .theme-card.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .theme-card-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .theme-card-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .theme-card-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* CSS 编辑器 */
        #css-editor {
            width: 100%;
            min-height: 350px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            padding: 1rem;
            resize: vertical;
            outline: none;
        }

        #css-editor:focus {
            border-color: var(--accent);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            font-size: 0.875rem;
            opacity: 0;
            transform: translateY(1rem) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--error); }

        /* 帮助提示 */
        .help-section {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .help-section h4 {
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .help-section p, .help-section li {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .help-section ul {
            padding-left: 1.25rem;
            margin: 0;
        }

        /* 全屏预览按钮样式 */
        .fullscreen-exit {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
        }

        /* 滚动条美化 - 深色区域 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* 预览区域滚动条 - 浅色背景 */
        #preview-scroll::-webkit-scrollbar {
            width: 12px;
        }

        #preview-scroll::-webkit-scrollbar-track {
            background: #e5e5e5;
            border-radius: 6px;
        }

        #preview-scroll::-webkit-scrollbar-thumb {
            background: #999;
            border-radius: 6px;
            border: 2px solid #e5e5e5;
        }

        #preview-scroll::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Callout 样式 */
        .callout {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin: 1em 0;
            border-left: 4px solid;
        }

        .callout-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .callout-info,
        .callout-warning,
        .callout-danger,
        .callout-success,
        .callout-tip {
            background: #f5f7fa;
            border-color: #c7d0dc;
        }

        .callout-info .callout-title,
        .callout-warning .callout-title,
        .callout-danger .callout-title,
        .callout-success .callout-title,
        .callout-tip .callout-title {
            color: #334155;
        }

        /* 任务列表（marked GFM 原生输出：<li><input type="checkbox">…</li>） */
        #preview-container li:has(> input[type="checkbox"]) {
            list-style: none;
            margin-left: -1.5em;
        }

        #preview-container li input[type="checkbox"] {
            margin-right: 0.5em;
            transform: scale(1.2);
        }

        /* 高亮文本 */
        mark, .highlight {
            background: #fff3bf;
            padding: 0.1em 0.3em;
            border-radius: 3px;
            color: #2f2f2f;
        }

        /* 脚注 */
        .footnote-ref {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.75em;
            vertical-align: super;
        }

        .footnotes {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #ddd;
            font-size: 0.875em;
            color: #666;
        }

        .footnotes ol {
            padding-left: 1.5em;
        }

        .footnotes li {
            margin: 0.5em 0;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .header {
                flex-wrap: wrap;
                gap: 0.75rem;
            }

            .stats {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .header-actions {
                order: 2;
                width: 100%;
                justify-content: center;
            }

            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(180px, 40%) minmax(0, 1fr);
            }

            .main-container.fullscreen-mode {
                grid-template-rows: minmax(0, 1fr);
            }

            .panel:first-child {
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }

        @media (max-width: 560px) {
            .header { padding: 0.65rem; }
            .logo { width: 100%; justify-content: center; }
            .logo h1 { font-size: 1rem; }
            .stats { gap: 1rem; }
            .header-actions { gap: 0.35rem; }
            .btn { padding: 0.45rem 0.65rem; }
            .modal-overlay { padding: 0.75rem; }
            .modal-footer { flex-wrap: wrap; }
            #preview-container { padding: 1.25rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">📝</div>
            <h1>Obsidian → 微信公众号<span>Pro</span></h1>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span>字数</span>
                <span class="stat-value" id="char-count">0</span>
            </div>
            <div class="stat-item">
                <span>词数</span>
                <span class="stat-value" id="word-count">0</span>
            </div>
            <div class="stat-item">
                <span>阅读</span>
                <span class="stat-value" id="read-time">0 分钟</span>
            </div>
        </div>

        <div class="header-actions">
            <button type="button" class="btn" onclick="selectImageFolder()" title="选择图片文件夹（Chrome/Edge：选择整个文件夹；其他浏览器：多选图片文件）" id="img-folder-btn">🖼️ 图片</button>
            <button type="button" class="btn" onclick="toggleToc()" title="显示目录" id="toc-toggle" aria-controls="toc-panel" aria-expanded="false">📑 目录</button>
            <button type="button" class="btn" onclick="openCssEditor()" title="自定义样式">🎨 样式</button>
            <button type="button" class="btn" onclick="toggleFullscreen()" title="全屏预览" id="fullscreen-toggle" aria-pressed="false">🖥️ 全屏</button>
            <div class="export-dropdown">
                <button type="button" class="btn" onclick="toggleExportMenu()" title="导出" id="export-toggle" aria-haspopup="menu" aria-controls="export-menu" aria-expanded="false">💾 导出</button>
                <div class="export-menu" id="export-menu" role="menu">
                    <button type="button" role="menuitem" class="export-item" onclick="exportMarkdown()">📝 导出 Markdown</button>
                    <button type="button" role="menuitem" class="export-item" onclick="exportHtml()">📄 导出 HTML</button>
                    <button type="button" role="menuitem" class="export-item" onclick="exportImage('png')">🖼️ 导出图片 (PNG)</button>
                    <button type="button" role="menuitem" class="export-item" onclick="exportImage('jpeg')">🖼️ 导出图片 (JPG)</button>

        // ==================== 状态变量 ====================
        const STYLE_VERSION = 'muted-accent-v2';

        function getInitialCss() {
            const savedTheme = localStorage.getItem('wxArticleTheme') || 'default';
            const savedCss = localStorage.getItem('wxArticleCss');
            const savedVersion = localStorage.getItem('wxArticleStyleVersion');
            const hasOldDefaultAccent = savedCss && (
                savedCss.includes('#6366f1') ||
                savedCss.includes('#7c3aed') ||
                savedCss.includes('#07c160')
            );
            const hasOldWarmAccent = savedCss && (
                savedCss.includes('#e74c3c') ||
                savedCss.includes('#f39c12') ||
                savedCss.includes('#c0392b')
            );

            if (savedVersion !== STYLE_VERSION && savedTheme === 'default' && hasOldDefaultAccent) {
                localStorage.setItem('wxArticleCss', themes.default.css);
                localStorage.setItem('wxArticleStyleVersion', STYLE_VERSION);
                return themes.default.css;
            }
            if (savedVersion !== STYLE_VERSION && savedTheme === 'warm' && hasOldWarmAccent) {
                localStorage.setItem('wxArticleCss', themes.warm.css);
                localStorage.setItem('wxArticleStyleVersion', STYLE_VERSION);
                return themes.warm.css;
            }

            return savedCss || themes.default.css;
        }

        let currentTheme = 'default';
        let currentCss = getInitialCss();
        let isFullscreen = false;
        let isExporting = false; // 导出防重入，避免重复点击创建重名临时容器
        let footnotes = [];
        let imageCache = {};     // 完整文件名 -> base64
        let imageStemCache = {}; // 去扩展名文件名 -> base64（支持 ![[name]] 省略扩展名的写法）
        let imageKeyConflicts = new Set(); // 同名附件不猜测，避免静默错图
        let loadedImageCount = 0;
        let imageFolderHandle = null; // 文件夹句柄
        let lastFocusedElement = null;
        let draftSaveWarningShown = false;

        function normalizeImageKey(name) {
            return String(name || '').replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
        }

        function cacheImageAlias(cache, key, base64, kind) {
            key = normalizeImageKey(key);
            if (!key) return;
            const conflictKey = `${kind}:${key.toLowerCase()}`;
            const existingKey = Object.keys(cache).find(candidate => candidate.toLowerCase() === key.toLowerCase());
            if (existingKey && cache[existingKey] !== base64) {
                delete cache[existingKey];
                imageKeyConflicts.add(conflictKey);
                return;
            }
            if (!imageKeyConflicts.has(conflictKey)) cache[key] = base64;
        }

        function addImageToCache(name, base64, relativePath = name) {
            const path = normalizeImageKey(relativePath || name);
            const basename = normalizeImageKey(name || path.split('/').pop());
            const pathWithoutRoot = path.includes('/') ? path.split('/').slice(1).join('/') : path;
            const fullAliases = new Set([path, pathWithoutRoot, basename]);
            fullAliases.forEach(key => cacheImageAlias(imageCache, key, base64, 'full'));
            fullAliases.forEach(key => {
                const stem = key.replace(/\.[^.\/]+$/, '');
                if (stem && stem !== key) cacheImageAlias(imageStemCache, stem, base64, 'stem');
            });
            loadedImageCount++;
        }

        function resolveCachedImage(reference) {
            const key = normalizeImageKey(reference);
            const basename = key.split('/').pop();
            const candidates = key.includes('/') ? [key] : [key, basename];
            for (const candidate of candidates) {
                const full = Object.keys(imageCache).find(item => item.toLowerCase() === candidate.toLowerCase());
                if (full) return imageCache[full];
                const stemCandidate = candidate.replace(/\.[^.\/]+$/, '');
                const stem = Object.keys(imageStemCache).find(item => item.toLowerCase() === stemCandidate.toLowerCase());
                if (stem) return imageStemCache[stem];
            }
            return null;
        }

        function isAmbiguousImageReference(reference) {
            const key = normalizeImageKey(reference);
            const stem = key.replace(/\.[^.\/]+$/, '');
            return imageKeyConflicts.has(`full:${key.toLowerCase()}`)
                || imageKeyConflicts.has(`stem:${stem.toLowerCase()}`);
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            initThemeGrid();
            loadSavedTheme();
            restoreDraft();
            applyCurrentCss();
            setupEventListeners();
            renderPreview();
            updateStats();
            checkCoreDependencies();
        });

        function initThemeGrid() {
            const grid = document.getElementById('theme-grid');
            grid.innerHTML = Object.entries(themes).map(([key, theme]) => `
                <button type="button" class="theme-card ${currentTheme === key ? 'active' : ''}"
                     onclick="selectTheme('${key}')" data-theme="${key}" aria-pressed="${currentTheme === key}">
                    <div class="theme-card-icon">${theme.icon}</div>
                    <div class="theme-card-name">${theme.name}</div>
                    <div class="theme-card-desc">${theme.desc}</div>
                </button>
            `).join('');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('wxArticleTheme');
            if (saved && themes[saved]) {
                currentTheme = saved;
                currentCss = localStorage.getItem('wxArticleCss') || themes[saved].css;
            }
        }

        function setupEventListeners() {
            const input = document.getElementById('markdown-input');
            const dropZone = document.getElementById('drop-zone');

            // 输入监听
            input.addEventListener('input', debounce(() => {
                renderPreview();
                updateStats();
                saveDraft();
            }, 300));

            // 拖拽上传
            input.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('active');
            });

            input.addEventListener('dragleave', () => {
                dropZone.classList.remove('active');
            });

            input.addEventListener('drop', async (e) => {
                e.preventDefault();
                dropZone.classList.remove('active');

                const files = e.dataTransfer.files;
                for (const file of files) {
                    if (file.type.startsWith('image/')) {
                        await insertImage(file, input);
                    }
                }
            });

            // 粘贴图片
            input.addEventListener('paste', async (e) => {
                const items = e.clipboardData.items;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        await insertImage(file, input);
                        return;
                    }
                }

                // textarea 只认纯文本：从 Word/网页等富文本来源粘贴时，浏览器默认只取
                // 纯文本部分，链接的 URL 会直接丢失。这里检测剪贴板里的 HTML，把 <a href>
                // 转成 Markdown 的 [文字](网址) 语法再手动插入，其余内容仍按纯文本处理
                const html = e.clipboardData.getData('text/html');
                if (html) {
                    const converted = htmlLinksToMarkdown(html);
                    if (converted.linkCount > 0) {
                        e.preventDefault();
                        const start = input.selectionStart;
                        const end = input.selectionEnd;
                        const value = input.value;
                        input.value = value.slice(0, start) + converted.text + value.slice(end);
                        const newPos = start + converted.text.length;
                        input.selectionStart = input.selectionEnd = newPos;
                        renderPreview();
                        updateStats();
                        saveDraft();
                        showToast(`✓ 已自动转换 ${converted.linkCount} 个链接`, 'success');
                    }
                }
            });

            document.addEventListener('keydown', handleGlobalKeydown);
            document.getElementById('css-modal').addEventListener('click', (event) => {
                if (event.target.id === 'css-modal') closeCssEditor();
            });
        }

        function handleGlobalKeydown(event) {
            const modal = document.getElementById('css-modal');
            if (event.key === 'Escape') {
                if (modal.classList.contains('active')) {
                    closeCssEditor();
                    return;
                }
                closeExportMenu();
                return;
            }

            if (event.key === 'Tab' && modal.classList.contains('active')) {
                const focusable = Array.from(modal.querySelectorAll('button, textarea, [href], [tabindex]:not([tabindex="-1"])'))
                    .filter(el => !el.disabled && el.offsetParent !== null);
                if (!focusable.length) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
        }

        // 把粘贴的富文本 HTML 转成纯文本，其中 <a href> 转成 Markdown [文字](网址) 语法——
        // 避免富文本粘贴进 textarea 时只保留纯文本导致链接的 URL 整个丢失
        function htmlLinksToMarkdown(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const blockTags = new Set(['P', 'DIV', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'TR', 'BLOCKQUOTE', 'SECTION']);
            let out = '';
            let linkCount = 0;

            function walk(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    out += node.textContent;
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;
                if (tag === 'A' && node.getAttribute('href')) {
                    const href = node.getAttribute('href').trim();
                    const text = node.textContent.trim();
                    if (text && /^https?:\/\//i.test(href)) {
                        out += `[${text}](${href})`;
                        linkCount++;
                        return;
                    }
                }
                if (tag === 'BR') { out += '\n'; return; }
                node.childNodes.forEach(walk);
                if (blockTags.has(tag)) out += '\n';
            }

            doc.body.childNodes.forEach(walk);
            return { text: out.replace(/\n{3,}/g, '\n\n').trim(), linkCount };
        }

        // ==================== 图片处理 ====================
        
        // 判断文件是否为图片（基于 MIME 类型和扩展名）
        function isImageFile(file) {
            // 首先检查 MIME 类型
            if (file.type && file.type.startsWith('image/')) {
                return true;
            }
            // 如果 MIME 类型不可用，检查文件扩展名
            const fileName = file.name.toLowerCase();
            const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp', '.svg', '.ico', '.tiff', '.tif'];
            return imageExtensions.some(ext => fileName.endsWith(ext));
        }

        function stripUrlQueryAndHash(value) {
            return (value || '').split('#')[0].split('?')[0];
        }

        function isSvgSrc(src) {
            const s = (src || '').trim();
            if (!s) return false;
            if (s.startsWith('data:image/svg+xml')) return true;
            const noQuery = stripUrlQueryAndHash(s).toLowerCase();
            return noQuery.endsWith('.svg');
        }

        function isVideoSrc(src) {
            const s = (src || '').trim();
            if (!s) return false;
            if (s.startsWith('data:video/')) return true;
            const noQuery = stripUrlQueryAndHash(s).toLowerCase();
            const videoExts = ['.mp4', '.mov', '.m4v', '.webm', '.ogv', '.ogg', '.avi', '.mkv'];
            return videoExts.some(ext => noQuery.endsWith(ext));
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function safeDecodeURIComponent(value) {
            try {
                return decodeURIComponent(value);
            } catch {
                return value;
            }
        }
        
        // 选择 Obsidian 附件文件夹
        async function selectImageFolder() {
            try {
                // 检查浏览器是否支持 File System Access API
                if (!('showDirectoryPicker' in window)) {
                    // 降级方案：使用 input[type=file] 多选
                    // 先显示使用说明
                    const useChrome = confirm(
                        '当前浏览器不支持文件夹选择功能。\n\n' +
                        '📌 使用说明：\n' +
                        '1. 推荐使用 Chrome 或 Edge 浏览器（支持选择整个文件夹）\n' +
                        '2. 当前方式：请按住 Ctrl 键（Mac 按住 Cmd）多选图片文件\n' +
                        '3. 如果看不到图片，请在文件类型下拉菜单中选择"所有文件"或"图片文件"\n\n' +
                        '点击"确定"继续选择图片文件，或点击"取消"使用 Chrome/Edge 浏览器。'
                    );
                    if (!useChrome) return;
                    
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.multiple = true;
                    // 使用 image/* 作为主要过滤器，同时添加具体扩展名
                    input.accept = 'image/*,.png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.ico,.tiff,.tif';
                    input.onchange = async (e) => {
                        const files = e.target.files;
                        if (!files || files.length === 0) return;
                        
                        let loadedCount = 0;
                        let skippedCount = 0;
                        showToast('正在处理图片...', 'info');
                        
                        for (const file of files) {
                            if (isImageFile(file)) {
                                try {
                                    const base64 = await fileToBase64(file);
                                    addImageToCache(file.name, base64, file.webkitRelativePath || file.name);
                                    loadedCount++;
                                } catch (err) {
                                    console.error('处理图片失败:', file.name, err);
                                    skippedCount++;
                                }
                            } else {
                                skippedCount++;
                            }
                        }
                        
                        updateImageButton();
                        renderPreview();
                        
                        if (loadedCount > 0) {
                            showToast(`✓ 已加载 ${loadedCount} 张图片${skippedCount > 0 ? `，跳过 ${skippedCount} 个非图片文件` : ''}`, 'success');
                        } else {
                            showToast(`未找到图片文件。请确保选择了 .png, .jpg, .gif 等格式的图片`, 'error');
                        }
                    };
                    input.click();
                    return;
                }

                // 使用 File System Access API 选择文件夹
                showToast('请选择包含图片的文件夹...', 'info');
                imageFolderHandle = await window.showDirectoryPicker({
                    mode: 'read'
                });
                
                // 读取文件夹中的所有图片
                let loadedCount = 0;
                let skippedCount = 0;
                showToast('正在扫描文件夹中的图片...', 'info');
                
                // 递归读取文件夹（包括子文件夹）
                async function readDirectory(dirHandle, relativePath = '') {
                    for await (const entry of dirHandle.values()) {
                        if (entry.kind === 'file') {
                            const file = await entry.getFile();
                            if (isImageFile(file)) {
                                try {
                                    const base64 = await fileToBase64(file);
                                    const filePath = relativePath ? `${relativePath}/${file.name}` : file.name;
                                    addImageToCache(file.name, base64, filePath);
                                    loadedCount++;
                                } catch (err) {
                                    console.error('处理图片失败:', file.name, err);
                                    skippedCount++;
                                }
                            } else {
                                skippedCount++;
                            }
                        } else if (entry.kind === 'directory') {
                            // 递归读取子文件夹
                            const subDir = await dirHandle.getDirectoryHandle(entry.name);
                            const subPath = relativePath ? `${relativePath}/${entry.name}` : entry.name;
                            await readDirectory(subDir, subPath);
                        }
                    }
                }
                
                await readDirectory(imageFolderHandle);
                
                updateImageButton();
                renderPreview();
                
                if (loadedCount > 0) {
                    showToast(`✓ 已加载 ${loadedCount} 张图片${skippedCount > 0 ? `，跳过 ${skippedCount} 个非图片文件` : ''}`, 'success');
                } else {
                    showToast(`未找到图片文件。请确保文件夹中包含 .png, .jpg, .gif 等格式的图片`, 'error');
                }
                
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('图片文件夹选择失败:', err);
                    showToast('请使用 Chrome/Edge 浏览器，或直接选择图片文件', 'error');
                }
            }
        }

        // 更新图片按钮显示
        function updateImageButton() {
            const btn = document.getElementById('img-folder-btn');
            const count = loadedImageCount;
            if (count > 0) {
                btn.textContent = `🖼️ ${count}张`;
                btn.style.background = 'var(--success)';
                btn.style.borderColor = 'var(--success)';
            }
        }

        // 处理 Obsidian 图片链接，替换为缓存中的 base64
        function processObsidianImages(markdown) {
            // 匹配 ![[filename]] 或 ![[filename|width]] 格式
            return markdown.replace(/!\[\[([^\]|]+)(?:\|(\d+))?\]\]/g, (match, filename, width) => {
                const file = (filename || '').trim();

                // 视频：公众号不支持直接粘贴，渲染为可复制的占位提示
                if (isVideoSrc(file)) {
                    const wrapStyle = width ? ` style="max-width: ${width}px; margin: 1em auto;"` : ` style="margin: 1em 0;"`;
                    const safeName = escapeHtml(file);
                    const isLink = /^https?:\/\//i.test(file);
                    const linkHtml = isLink
                        ? `<p><strong>链接：</strong><a href="${safeName}" target="_blank" rel="noopener">${safeName}</a></p>`
                        : '';

                    return `<div${wrapStyle}>
                        <p><strong>🎬 视频：</strong><code>${safeName}</code></p>
                        ${linkHtml}
                        <blockquote>微信公众号编辑器不支持直接粘贴视频，请在公众号后台使用「插入视频」功能添加。</blockquote>
                    </div>`;
                }

                // 精确匹配完整文件名 → 去扩展名 → 大小写不敏感匹配
                let base64 = resolveCachedImage(file);
                
                if (base64) {
                    const style = width ? ` style="max-width: ${width}px"` : '';
                    return `<img src="${base64}" alt="${escapeHtml(file)}"${style}>`;
                } else {
                    // 图片未找到，显示占位符
                    const safeName = escapeHtml(file);
                    const reason = isAmbiguousImageReference(file)
                        ? '存在同名图片，请在 Markdown 中补充附件相对路径'
                        : '请点击顶部「🖼️ 图片」按钮选择 Obsidian 附件文件夹';
                    return `<div style="background: #fee2e2; color: #b91c1c; padding: 1em; border-radius: 8px; margin: 1em 0; text-align: center;">
                        <div style="font-size: 2em; margin-bottom: 0.5em;">🖼️</div>
                        <div>图片未找到: <code>${safeName}</code></div>
                        <div style="font-size: 0.85em; margin-top: 0.5em; color: #666;">${reason}</div>
                    </div>`;
                }
            });
        }

        // 处理标准 Markdown 图片 ![alt](path)：本地相对路径（Obsidian 导出常见格式）
        // 同样按文件名（忽略路径前缀）到图片缓存中查找，网络图片/data URI 原样交给 marked
        function processStandardImages(markdown) {
            return markdown.replace(/!\[([^\]]*)\]\((?:<([^>]+)>|((?:\\[()]|[^)\s])+))(?:\s+"[^"]*")?\)/g, (match, alt, angleSrc, plainSrc) => {
                const url = (angleSrc || plainSrc || '').replace(/\\([()])/g, '$1').trim();
                if (/^(https?:|data:)/i.test(url)) return match;

                const decodedUrl = safeDecodeURIComponent(url);
                const filename = normalizeImageKey(decodedUrl);
                const base64 = resolveCachedImage(filename);
                if (base64) {
                    return `![${alt}](${base64})`;
                }

                const safeName = escapeHtml(filename || url);
                const reason = isAmbiguousImageReference(filename)
                    ? '存在同名图片，请保留图片的附件相对路径'
                    : '请点击顶部「🖼️ 图片」按钮选择 Obsidian 附件文件夹';
                return `<div style="background: #fee2e2; color: #b91c1c; padding: 1em; border-radius: 8px; margin: 1em 0; text-align: center;">
                    <div style="font-size: 2em; margin-bottom: 0.5em;">🖼️</div>
                    <div>图片未找到: <code>${safeName}</code></div>
                    <div style="font-size: 0.85em; margin-top: 0.5em; color: #666;">${reason}</div>
                </div>`;
            });
        }

        // 大小写不敏感的精确匹配（完整文件名或去扩展名）。
        // 不做子串模糊匹配：避免 1.png 误命中 11.png 之类的错图
        function findSimilarImage(filename) {
            return resolveCachedImage(filename);
        }

        async function insertImage(file, textarea) {
            try {
                const base64 = await fileToBase64(file);
                const cursor = textarea.selectionStart;
                const text = textarea.value;
                const imageMarkdown = `![${file.name}](${base64})\n`;
                
                // 同时加入缓存
                addImageToCache(file.name, base64);
                
                textarea.value = text.slice(0, cursor) + imageMarkdown + text.slice(cursor);
                textarea.selectionStart = textarea.selectionEnd = cursor + imageMarkdown.length;
                
                updateImageButton();
                renderPreview();
                updateStats();
                saveDraft();
                showToast('✓ 图片已插入', 'success');
            } catch (err) {
                showToast('图片处理失败', 'error');
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ==================== Markdown 处理 ====================
        function protectMarkdownCode(markdown) {
            const codeBlocks = [];
            const inlineCodes = [];

            const text = markdown
                .replace(/(^|\n)(```|~~~)[^\n]*\n[\s\S]*?\n\2(?=\n|$)/g, (match) => {
                    codeBlocks.push(match);
                    return `\n%%CODE_BLOCK_${codeBlocks.length - 1}%%`;
                })
                .replace(/`[^`\n]+`/g, (match) => {
                    inlineCodes.push(match);
                    return `%%INLINE_CODE_${inlineCodes.length - 1}%%`;
                });

            return { text, codeBlocks, inlineCodes };
        }

        function restoreMarkdownCode(markdown, protectedCode) {
            return markdown
                .replace(/%%CODE_BLOCK_(\d+)%%/g, (match, i) => protectedCode.codeBlocks[i] || match)
                .replace(/%%INLINE_CODE_(\d+)%%/g, (match, i) => protectedCode.inlineCodes[i] || match);
        }

        // ==================== 代码语法高亮 ====================
        // 颜色直接内联到 span 上（不依赖 class）：公众号粘贴会剥掉 class，
        // 只有内联样式能存活；预览、复制、导出因此天然一致
        const HLJS_DARK_COLORS = {
            'hljs-keyword': '#c678dd', 'hljs-built_in': '#e6c07b', 'hljs-type': '#e6c07b',
            'hljs-literal': '#56b6c2', 'hljs-number': '#d19a66', 'hljs-operator': '#56b6c2',
            'hljs-regexp': '#98c379', 'hljs-string': '#98c379', 'hljs-subst': '#e06c75',
            'hljs-symbol': '#61aeee', 'hljs-class': '#e6c07b', 'hljs-function': '#61aeee',
            'hljs-title': '#61aeee', 'hljs-params': '#d19a66', 'hljs-comment': '#7f848e',
            'hljs-doctag': '#c678dd', 'hljs-meta': '#61aeee', 'hljs-section': '#e06c75',
            'hljs-tag': '#e06c75', 'hljs-name': '#e06c75', 'hljs-attr': '#d19a66',
            'hljs-attribute': '#98c379', 'hljs-variable': '#e06c75', 'hljs-bullet': '#61aeee',
            'hljs-addition': '#98c379', 'hljs-deletion': '#e06c75', 'hljs-quote': '#7f848e',
            'hljs-selector-tag': '#e06c75', 'hljs-selector-id': '#61aeee', 'hljs-selector-class': '#d19a66',
            'hljs-property': '#e06c75', 'hljs-template-variable': '#e06c75', 'hljs-link': '#61aeee'
        };
        const HLJS_LIGHT_COLORS = {
            'hljs-keyword': '#d73a49', 'hljs-built_in': '#e36209', 'hljs-type': '#6f42c1',
            'hljs-literal': '#005cc5', 'hljs-number': '#005cc5', 'hljs-operator': '#005cc5',
            'hljs-regexp': '#032f62', 'hljs-string': '#032f62', 'hljs-subst': '#24292e',
            'hljs-symbol': '#e36209', 'hljs-class': '#6f42c1', 'hljs-function': '#6f42c1',
            'hljs-title': '#6f42c1', 'hljs-params': '#24292e', 'hljs-comment': '#6a737d',
            'hljs-doctag': '#d73a49', 'hljs-meta': '#005cc5', 'hljs-section': '#005cc5',
            'hljs-tag': '#22863a', 'hljs-name': '#22863a', 'hljs-attr': '#005cc5',
            'hljs-attribute': '#005cc5', 'hljs-variable': '#e36209', 'hljs-bullet': '#735c0f',
            'hljs-addition': '#22863a', 'hljs-deletion': '#b31d28', 'hljs-quote': '#6a737d',
            'hljs-selector-tag': '#22863a', 'hljs-selector-id': '#6f42c1', 'hljs-selector-class': '#6f42c1',
            'hljs-property': '#005cc5', 'hljs-template-variable': '#e36209', 'hljs-link': '#032f62'
        };

        function isLightColor(cssColor) {
            const m = (cssColor || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!m) return true;
            const lum = 0.299 * m[1] + 0.587 * m[2] + 0.114 * m[3];
            return lum > 140;
        }

        function highlightCodeBlocks(container) {
            if (typeof hljs === 'undefined') return;
            container.querySelectorAll('pre code').forEach(codeEl => {
                // 只高亮显式标注了语言的代码块（```python）；
                // 未标注的（字符画、关系图等）保持原样，避免误着色
                const langMatch = (codeEl.className || '').match(/language-([\w+-]+)/);
                if (!langMatch) return;
                const lang = langMatch[1].toLowerCase();
                if (!hljs.getLanguage(lang)) return;

                let result;
                try {
                    result = hljs.highlight(codeEl.textContent, { language: lang });
                } catch {
                    return;
                }
                codeEl.innerHTML = result.value;

                const preEl = codeEl.closest('pre');
                const bg = preEl ? window.getComputedStyle(preEl).backgroundColor : '';
                const palette = isLightColor(bg) ? HLJS_LIGHT_COLORS : HLJS_DARK_COLORS;
                codeEl.querySelectorAll('[class*="hljs-"]').forEach(span => {
                    for (const cls of span.classList) {
                        if (palette[cls]) {
                            span.style.color = palette[cls];
                            break;
                        }
                    }
                });
            });
        }

        function getMissingCoreDependencies() {
            const missing = [];
            if (typeof marked === 'undefined') missing.push('Markdown 渲染器');
            if (typeof DOMPurify === 'undefined') missing.push('安全过滤器');
            return missing;
        }

        function checkCoreDependencies() {
            const missing = getMissingCoreDependencies();
            if (missing.length) {
                showToast(`资源加载失败：${missing.join('、')}。请检查网络后刷新。`, 'error');
                return false;
            }
            return true;
        }

        function renderPreview() {
            const container = document.getElementById('preview-container');
            const missing = getMissingCoreDependencies();
            if (missing.length) {
                container.replaceChildren();
                const message = document.createElement('p');
                message.style.cssText = 'color:#b91c1c;text-align:center;padding:60px 20px;';
                message.textContent = `无法预览：${missing.join('、')}加载失败。请检查网络后刷新页面。`;
                container.appendChild(message);
                return;
            }

            try {
                renderPreviewUnsafe();
            } catch (error) {
                console.error('预览渲染失败:', error);
                container.replaceChildren();
                const message = document.createElement('p');
                message.style.cssText = 'color:#b91c1c;text-align:center;padding:60px 20px;';
                message.textContent = '预览渲染失败，请检查最近输入的 Markdown 语法。';
                container.appendChild(message);
                showToast('预览渲染失败，请检查 Markdown 内容', 'error');
            }
        }

        function sanitizeRenderedHtml(html) {
            return DOMPurify.sanitize(html, {
                USE_PROFILES: { html: true, svg: true, svgFilters: true, mathMl: true },
                ADD_TAGS: ['video', 'source'],
                ADD_ATTR: ['target', 'controls', 'poster', 'playsinline', 'checked', 'disabled', 'data-formula'],
                FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed', 'form', 'template'],
                FORBID_ATTR: ['srcdoc']
            });
        }

        function renderPreviewUnsafe() {
            const markdown = document.getElementById('markdown-input').value;
            if (!markdown.trim()) {
                document.getElementById('preview-container').innerHTML = 
                    '<p style="color: #999; text-align: center; padding: 60px 20px;">在左侧输入 Markdown 开始预览...</p>';
                document.getElementById('toc-content').innerHTML = '';
                return;
            }

            const protectedCode = protectMarkdownCode(markdown);
            let processed = protectedCode.text;
            footnotes = [];

            // 1. 处理 Obsidian 图片 ![[filename]] - 使用图片缓存
            processed = processObsidianImages(processed);
            // 1b. 标准 Markdown 图片 ![alt](本地相对路径) 也走同一份图片缓存（按文件名匹配，忽略路径前缀）
            processed = processStandardImages(processed);

            // 2. 处理高亮 ==text==
            processed = processed.replace(/==([^=]+)==/g, '<mark>$1</mark>');

            // 3. 任务列表由 marked 的 GFM 语法原生渲染（手工替换成裸 <li> 会破坏列表嵌套结构）

            // 4. 处理 Callout（兼容 [!type]+/- 折叠标记、文末无换行的情况；
            //    内容需先还原被保护的代码占位符再交给 marked，否则行内代码会显示为字面反引号）
            processed = processed.replace(/^> \[!(\w+)\][+-]?([^\n]*)(?:\n((?:> .*\n?)*))?/gm, (m, type, title, content) => {
                const cleanContent = restoreMarkdownCode((content || '').replace(/^> ?/gm, '').trim(), protectedCode);
                const calloutType = type.toLowerCase();
                const icon = { info: 'ℹ️', warning: '⚠️', danger: '🚨', success: '✅', tip: '💡', note: '📝' }[calloutType] || '📌';
                return `<div class="callout callout-${calloutType}">
                    <div class="callout-title">${icon} ${title.trim() || type}</div>
                    <div class="callout-content">${marked.parse(cleanContent)}</div>
                </div>`;
            });

            // 5. 处理脚注定义 [^n]: content
            processed = processed.replace(/^\[\^(\d+)\]:\s*(.+)$/gm, (m, id, content) => {
                footnotes.push({ id, content });
                return '';
            });

            // 6. 处理脚注引用 [^n]
            processed = processed.replace(/\[\^(\d+)\]/g, '<sup class="footnote-ref"><a href="#fn$1" id="fnref$1">[$1]</a></sup>');

            // 7. 保护数学公式
            const blockFormulas = [];
            processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, (m, formula) => {
                blockFormulas.push(formula);
                return `%%BLOCK_${blockFormulas.length - 1}%%`;
            });

            const inlineFormulas = [];
            // 要求 $ 内侧紧贴非空白字符、且闭合 $ 后不跟数字，避免把货币金额（如 "$5 和 $10"）误判为公式
            processed = processed.replace(/(?<![\d$\\])\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (m, formula) => {
                inlineFormulas.push(formula);
                return `%%INLINE_${inlineFormulas.length - 1}%%`;
            });

            // 8. 还原代码，再转换 Markdown
            processed = restoreMarkdownCode(processed, protectedCode);
            let html = marked.parse(processed);

            // 9. 还原数学公式
            html = html.replace(/%%BLOCK_(\d+)%%/g, (m, i) => {
                try {
                    return `<div class="katex-display">${katex.renderToString(blockFormulas[i], { displayMode: true, throwOnError: false })}</div>`;
                } catch { return `<pre>${blockFormulas[i]}</pre>`; }
            });

            html = html.replace(/%%INLINE_(\d+)%%/g, (m, i) => {
                try {
                    return katex.renderToString(inlineFormulas[i], { displayMode: false, throwOnError: false });
                } catch { return `<code>${inlineFormulas[i]}</code>`; }
            });

            // 10. 添加脚注
            if (footnotes.length > 0) {
                html += '<div class="footnotes"><hr><ol>';
                footnotes.forEach(fn => {
                    html += `<li id="fn${fn.id}">${fn.content} <a href="#fnref${fn.id}">↩</a></li>`;
                });
                html += '</ol></div>';
            }

            const container = document.getElementById('preview-container');
            container.innerHTML = sanitizeRenderedHtml(html);
            container.querySelectorAll('a[target="_blank"]').forEach(link => link.setAttribute('rel', 'noopener noreferrer'));
            container.querySelectorAll('img').forEach(img => {
                img.loading = 'lazy';
                img.decoding = 'async';
            });
            highlightCodeBlocks(container);
            generateToc();
        }

        // ==================== 目录生成 ====================
        function generateToc() {
            const container = document.getElementById('preview-container');
            const headings = container.querySelectorAll('h1, h2, h3');
            const tocContent = document.getElementById('toc-content');
            
            if (headings.length === 0) {
                tocContent.innerHTML = '<div style="padding: 1rem; color: var(--text-muted); font-size: 0.8rem;">暂无标题</div>';
                return;
            }

            tocContent.replaceChildren();
            headings.forEach((h, i) => {
                const level = h.tagName.toLowerCase();
                const id = `heading-${i}`;
                h.id = id;
                const item = document.createElement('button');
                item.type = 'button';
                item.className = `toc-item level-${level.slice(1)}`;
                item.textContent = h.textContent;
                item.addEventListener('click', () => scrollToHeading(id));
                tocContent.appendChild(item);
            });
        }

        function scrollToHeading(id) {
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function toggleToc() {
            const panel = document.getElementById('toc-panel');
            const isOpen = panel.classList.toggle('show');
            document.getElementById('toc-toggle').setAttribute('aria-expanded', String(isOpen));
        }

        // ==================== 统计信息 ====================
        function updateStats() {
            const text = document.getElementById('markdown-input').value;
            const chars = text.length;
            const words = text.trim()
                ? (text.match(/[\u3400-\u9fff]/g)?.length || 0) + (text.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g)?.length || 0)
                : 0;
            const readTime = chars ? Math.max(1, Math.ceil(chars / 500)) : 0;

            document.getElementById('char-count').textContent = chars.toLocaleString();
            document.getElementById('word-count').textContent = words.toLocaleString();
            document.getElementById('read-time').textContent = `${readTime} 分钟`;
        }

        // ==================== 主题与样式 ====================
        function selectTheme(themeName) {
            currentTheme = themeName;
            document.getElementById('css-editor').value = themes[themeName].css;
            
            document.querySelectorAll('.theme-card').forEach(card => {
                card.classList.toggle('active', card.dataset.theme === themeName);
                card.setAttribute('aria-pressed', String(card.dataset.theme === themeName));
            });
        }

        function openCssEditor() {
            lastFocusedElement = document.activeElement;
            document.getElementById('css-editor').value = currentCss;
            initThemeGrid();
            const modal = document.getElementById('css-modal');

        // 将主题 CSS 中的裸选择器（h1、p、a 等）限定到 #preview-container，
        // 避免主题样式泄漏到工具界面（弹窗、目录、帮助文本等）
        function scopeCssToPreview(cssText, scope = '#preview-container') {
            try {
                const doc = document.implementation.createHTMLDocument('');
                const style = doc.createElement('style');
                style.textContent = cssText;
                doc.head.appendChild(style);
                if (!style.sheet) return cssText;

                const scopeRule = (rule) => {
                    if (rule.type === CSSRule.STYLE_RULE) {
                        const selectors = rule.selectorText.split(',').map(s => {
                            s = s.trim();
                            return s.startsWith(scope) ? s : `${scope} ${s}`;
                        });
                        return `${selectors.join(', ')} { ${rule.style.cssText} }`;
                    }
                    if (rule.type === CSSRule.MEDIA_RULE) {
                        return `@media ${rule.media.mediaText} { ${Array.from(rule.cssRules).map(scopeRule).join('\n')} }`;
                    }
                    // @import / @keyframes / @font-face 等原样保留
                    return rule.cssText;
                };

                return Array.from(style.sheet.cssRules).map(scopeRule).join('\n');
            } catch {
                return cssText;
            }
        }

            let styleEl = document.getElementById('custom-style');
            if (!styleEl) {

        // ==================== 复制功能（微信公众号优化）====================

        function isHttpUrl(url) {
            return /^https?:\/\//i.test((url || '').trim());
        }

        function getFileNameFromSrc(src) {
            const s = (src || '').trim();
            if (!s) return '';
            if (s.startsWith('data:')) return '视频';
            const noQuery = stripUrlQueryAndHash(s);
            const parts = noQuery.split('/');
            return parts[parts.length - 1] || noQuery;
        }

        function createWechatVideoFallbackElement(name, src) {
            const wrapper = document.createElement('div');
            const safeName = escapeHtml(name || '视频');
            const safeSrc = escapeHtml(src || '');
            const linkHtml = src && isHttpUrl(src)
                ? `<p><strong>链接：</strong><a href="${safeSrc}" target="_blank" rel="noopener">${safeSrc}</a></p>`
                : '';
            wrapper.innerHTML = `
                <p><strong>🎬 视频：</strong><code>${safeName}</code></p>
                ${linkHtml}
                <blockquote>微信公众号编辑器不支持直接粘贴视频，请在公众号后台使用「插入视频」功能添加。</blockquote>
            `;
            return wrapper;
        }

        function replaceVideoTagsForWechatCopy(rootEl) {
            const videos = Array.from(rootEl.querySelectorAll('video'));
            videos.forEach(video => {
                const src = video.getAttribute('src') || video.querySelector('source')?.getAttribute('src') || '';
                const name = src ? getFileNameFromSrc(src) : (video.getAttribute('title') || '视频');
                video.replaceWith(createWechatVideoFallbackElement(name, src));
            });
        }

        function replaceVideoImgTagsForWechatCopy(rootEl) {
            const imgs = Array.from(rootEl.querySelectorAll('img'));
            imgs.forEach(img => {
                const src = img.getAttribute('src') || '';
                if (!isVideoSrc(src)) return;
                const name = img.getAttribute('alt') || getFileNameFromSrc(src) || '视频';
                img.replaceWith(createWechatVideoFallbackElement(name, src));
            });
        }

        function decodeSvgDataUrlToText(dataUrl) {
            try {
                const commaIdx = dataUrl.indexOf(',');
                if (commaIdx === -1) return null;
                const meta = dataUrl.slice(0, commaIdx);
                const data = dataUrl.slice(commaIdx + 1);
                if (meta.includes(';base64')) return atob(data);
                return decodeURIComponent(data);
            } catch {
                return null;
            }
        }

        function extractSvgSizeFromText(svgText) {
            if (!svgText) return null;
            const widthMatch = svgText.match(/\bwidth\s*=\s*["']?([\d.]+)(px)?["']?/i);
            const heightMatch = svgText.match(/\bheight\s*=\s*["']?([\d.]+)(px)?["']?/i);
            const w = widthMatch ? parseFloat(widthMatch[1]) : null;
            const h = heightMatch ? parseFloat(heightMatch[1]) : null;
            if (w && h) return { width: w, height: h };

            const vbMatch = svgText.match(/\bviewBox\s*=\s*["']?([0-9.\s,-]+)["']?/i);
            if (vbMatch) {
                const parts = vbMatch[1].trim().split(/[\s,]+/).map(Number).filter(n => !Number.isNaN(n));
                if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
                    return { width: parts[2], height: parts[3] };
                }
            }
            return null;
        }

        async function normalizeSvgSrcToDataUrl(svgSrc) {
            const s = (svgSrc || '').trim();
            if (!s) return null;
            if (s.startsWith('data:image/svg+xml')) return s;
            if (!isHttpUrl(s)) return null;
            try {
                const resp = await fetch(s);
                const text = await resp.text();
                return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
            } catch {
                return null;
            }
        }

        async function svgSrcToPngDataUrl(svgSrc, renderWidth, renderHeight, scale = 2) {
            const dataUrl = await normalizeSvgSrcToDataUrl(svgSrc);
            if (!dataUrl) return null;

            const w = Math.max(1, Math.round(renderWidth || 0));
            const h = Math.max(1, Math.round(renderHeight || 0));
            if (!w || !h) return null;

            const image = new Image();
            image.crossOrigin = 'anonymous';
            image.decoding = 'async';

            const loaded = await new Promise(resolve => {
                image.onload = () => resolve(true);
                image.onerror = () => resolve(false);
                image.src = dataUrl;
            });
            if (!loaded) return null;

            const maxCanvasDim = 4096;
            const targetW = Math.max(1, Math.round(w * scale));
            const targetH = Math.max(1, Math.round(h * scale));
            const factor = Math.min(1, maxCanvasDim / Math.max(targetW, targetH));
            const canvasW = Math.max(1, Math.round(targetW * factor));
            const canvasH = Math.max(1, Math.round(targetH * factor));

            const canvas = document.createElement('canvas');
            canvas.width = canvasW;
            canvas.height = canvasH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return null;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(image, 0, 0, canvasW, canvasH);

            try {
                return canvas.toDataURL('image/png');
            } catch {
                return null;
            }
        }

        async function rasterizeSvgImagesForWechatCopy(rootEl) {
            const imgs = Array.from(rootEl.querySelectorAll('img'));
            const svgImgs = imgs.filter(img => isSvgSrc(img.getAttribute('src') || ''));
            let converted = 0;
            let failed = 0;

            for (const img of svgImgs) {
                const src = img.getAttribute('src') || '';

                const rect = img.getBoundingClientRect();
                let w = Math.round(rect.width);
                let h = Math.round(rect.height);

                if ((!w || !h) && src.startsWith('data:image/svg+xml')) {
                    const svgText = decodeSvgDataUrlToText(src);
                    const size = extractSvgSizeFromText(svgText);
                    if (size) {
                        w = w || Math.round(size.width);
                        h = h || Math.round(size.height);
                    }
                }

                w = w || img.naturalWidth || 800;
                h = h || img.naturalHeight || Math.round(w * 0.75);

                const png = await svgSrcToPngDataUrl(src, w, h, 2);
                if (png) {
                    img.setAttribute('src', png);
                    converted++;
                } else {
                    failed++;
                }
            }

            return { converted, failed };
        }

        // 块级 KaTeX 公式（$$..$$）光栅化为 PNG(base64)：公众号编辑器不支持 KaTeX
        // 的 HTML/字体结构，转成图片保真。
        // 注意：行内公式（$..$）不转图片——公众号编辑器常把 img 单独成段，
        // 会导致句子中间断行，因此行内公式仍走 Unicode 文本降级（纯文本不会被拆行）。
        async function rasterizeKatexForWechatCopy(rootEl) {
            if (typeof html2canvas === 'undefined') return;
            // 只处理最外层块级公式节点（.katex-display 内部还嵌套 .katex-display/.katex）
            const targets = Array.from(rootEl.querySelectorAll('.katex-display'))
                .filter(el => !(el.parentElement && el.parentElement.closest('.katex-display')));

            for (const el of targets) {
                if (!rootEl.contains(el)) continue;
                try {
                    const rect = el.getBoundingClientRect();
                    const w = Math.round(rect.width);
                    const h = Math.round(rect.height);
                    if (!w || !h) continue;

                    const canvas = await html2canvas(el, {
                        scale: 2,
                        backgroundColor: null,
                        logging: false
                    });
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    img.alt = extractLatexFromKatex(el) || '公式';
                    img.dataset.formula = 'block';
                    img.setAttribute('style', `display:block;margin:1em auto;width:${w}px;max-width:100%;height:auto;`);
                    el.replaceWith(img);
                } catch {
                    // 渲染失败：保留 KaTeX 节点，后续按 Unicode 文本降级
                }
            }
        }

        async function preprocessWechatCopyContainer(rootEl) {
            // 1) 视频：公众号不支持直接粘贴，替换为占位提示
            replaceVideoTagsForWechatCopy(rootEl);
            replaceVideoImgTagsForWechatCopy(rootEl);

            // 2) KaTeX 公式：光栅化为 PNG，保持排版保真
            await rasterizeKatexForWechatCopy(rootEl);

            // 3) SVG：转换为 PNG(base64)，以兼容公众号编辑器
            await rasterizeSvgImagesForWechatCopy(rootEl);
        }

        async function copyToClipboard() {
            const container = document.getElementById('preview-container');
            if (!hasArticleContent()) {
                showToast('请先输入内容', 'error');
                return;
            }
            
            // 创建用于复制的临时容器
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = container.innerHTML;
            document.body.appendChild(tempDiv);
            tempDiv.id = 'temp-copy-container';
            // 放在视口原点并压到最底层：html2canvas 对负坐标（视口外）元素渲染不可靠；
            // z-index:-1 会被上层不透明面板完全遮住，用户不可见
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '0';
            tempDiv.style.top = '0';
            tempDiv.style.zIndex = '-1';
            const containerRect = container.getBoundingClientRect();
            if (containerRect && containerRect.width) {
                tempDiv.style.width = `${Math.round(containerRect.width)}px`;
            }
            
            // 应用预览样式到临时容器
            const previewStyle = document.getElementById('custom-style');
            let tempStyle = null;
            let wechatHtml = '';

            try {
                if (previewStyle) {
                    tempStyle = document.createElement('style');
                    tempStyle.textContent = previewStyle.textContent.replace(/#preview-container/g, '#temp-copy-container');
                    document.head.appendChild(tempStyle);
                }

                // 等待样式应用
                await new Promise(r => setTimeout(r, 50));

                // 公众号兼容预处理（SVG->PNG / video->占位）
                await preprocessWechatCopyContainer(tempDiv);

                // 为微信公众号生成完整内联样式的 HTML
                wechatHtml = generateWechatHtml(tempDiv);
            } finally {
                if (tempStyle) tempStyle.remove();
                tempDiv.remove();
            }

            try {
                const blob = new Blob([wechatHtml], { type: 'text/html' });
                await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
                showToast('✓ 已复制！直接粘贴到公众号', 'success');
            } catch (clipboardError) {
                // 降级方案
                const tempContainer = document.createElement('div');
                tempContainer.innerHTML = wechatHtml;
                tempContainer.style.position = 'fixed';
                tempContainer.style.left = '-9999px';
                document.body.appendChild(tempContainer);
                
                const selection = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(tempContainer);
                selection.removeAllRanges();
                selection.addRange(range);
                const copied = document.execCommand('copy');
                selection.removeAllRanges();
                tempContainer.remove();

                if (!copied) {
                    console.error('复制失败:', clipboardError);
                    showToast('复制失败，请允许剪贴板权限后重试', 'error');
                    return;
                }
                showToast('✓ 已复制！直接粘贴到公众号', 'success');
            }
        }

        // 为微信公众号生成完整内联样式的 HTML
        let activeWechatCopyMode = 'default';

        // 纯渐变主题的兜底色是从渐变色标推导的（gradient 推出 #667eea），色板里
        // 写的却是 #fbf7ff，拿错参照会把本来够看的白标题压成灰色，对真实底反而更糟。
        let activeWechatCopyBg = '#ffffff';

        // 公众号复制安全色板：主题 CSS 负责浏览器预览，这里只提供在渐变、伪元素、
        // 阴影等被公众号过滤后仍能维持层级与可读性的纯色后备。
        const WECHAT_THEME_PROFILES = {

            wechat: { background: '#ffffff', text: '#3f3f3f', accent: '#000000', surface: '#f7f7f7', border: '#d0d7de', marker: '•' },
            elegant: { background: '#faf8f5', text: '#2c3e50', accent: '#8b4513', surface: '#faf5eb', border: '#c9a86c', marker: '◆' },
            brocade: { background: '#faf6ee', text: '#3a322a', accent: '#2f5d62', surface: '#ecf0ef', border: '#dccdb4', marker: '•', separator: '◆' },
            tech: { background: '#1a1a2e', text: '#e0e0e0', accent: '#00d9ff', surface: '#16213e', border: '#386579', marker: '•' },
            warm: { background: '#fff7eb', text: '#4a4a4a', accent: '#7c4a2d', surface: '#f6eadc', border: '#d8b892', marker: '•' },
            minimal: { background: '#ffffff', text: '#1a1a1a', accent: '#000000', surface: '#fafafa', border: '#e0e0e0', marker: '•' },
            academic: { background: '#ffffff', text: '#000000', accent: '#000000', surface: '#f5f5f5', border: '#000000', marker: '•' },
            night: { background: '#0d1117', text: '#c9d1d9', accent: '#58a6ff', surface: '#161b22', border: '#30363d', marker: '•' },

            poetry_moonlight: { background: '#f7f9ff', text: '#2f3342', accent: '#4338ca', surface: '#eef2ff', border: '#9aa4df', marker: '✦', separator: '✦' },
